<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="plateG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/><stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <linearGradient id="cakeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="creamG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- glow -->
  <circle cx="100" cy="95" r="88" fill="#a855f7" opacity="0.12"/>
  <!-- plate -->
  <ellipse cx="100" cy="172" rx="78" ry="14" fill="url(#plateG)"/>
  <!-- bottom tier -->
  <rect x="38" y="126" width="124" height="40" rx="10" fill="url(#cakeG)"/>
  <path d="M38 138 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 v-12 h-120 z" fill="url(#creamG)"/>
  <!-- top tier -->
  <rect x="58" y="92" width="84" height="38" rx="9" fill="url(#creamG)"/>
  <path d="M58 102 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 q8 10 16 0 v-10 h-80 z" fill="#f9a8d4"/>
  <!-- candles -->
  <g>
    <rect x="76" y="62" width="6" height="30" rx="3" fill="#8b5cf6"/>
    <rect x="97" y="56" width="6" height="36" rx="3" fill="#f59e0b"/>
    <rect x="118" y="62" width="6" height="30" rx="3" fill="#ec4899"/>
    <g class="flame">
      <path d="M79 62 c-5 -7 0 -12 0 -16 c0 4 5 9 0 16z" fill="url(#flameG)">
        <animate attributeName="opacity" values="1;0.75;1" dur="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M100 56 c-5 -7 0 -12 0 -16 c0 4 5 9 0 16z" fill="url(#flameG)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M121 62 c-5 -7 0 -12 0 -16 c0 4 5 9 0 16z" fill="url(#flameG)">
        <animate attributeName="opacity" values="1;0.7;1" dur="0.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  <!-- sprinkles -->
  <circle cx="70" cy="148" r="3" fill="#fbbf24"/>
  <circle cx="100" cy="155" r="3" fill="#a78bfa"/>
  <circle cx="130" cy="148" r="3" fill="#34d399"/>
  <circle cx="85" cy="112" r="2.5" fill="#f472b6"/>
  <circle cx="115" cy="112" r="2.5" fill="#60a5fa"/>
</svg>
